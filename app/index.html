<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Project Pulse</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="dashboard" aria-labelledby="dashboard-title">
      <header class="dashboard-header">
        <div>
          <h1 id="dashboard-title">Project Pulse</h1>
          <p>Track active contributor projects, current ownership, status, priority, and the latest activity at a glance.</p>
        </div>
      </header>

      <section class="dashboard-summary" aria-label="Project summary">
        <div>
          <strong id="project-count">0</strong>
          <span>Projects</span>
        </div>
        <div>
          <strong id="high-priority-count">0</strong>
          <span>High priority</span>
        </div>
        <div>
          <strong id="at-risk-count">0</strong>
          <span>At risk</span>
        </div>
        <div>
          <strong id="blocked-count">0</strong>
          <span>Blocked</span>
        </div>
      </section>

      <p id="dashboard-message" role="status" aria-live="polite">Loading project data...</p>
      <section id="project-grid" class="project-grid" aria-label="Projects"></section>
    </main>

    <script>
      const dataUrl = 'project-data.json';
      const statusClasses = {
        'On track': 'status--on-track',
        'At risk': 'status--at-risk',
        'Blocked': 'status--blocked'
      };
      const priorityClasses = {
        High: 'priority--high',
        Medium: 'priority--medium',
        Low: 'priority--low'
      };

      const projectGrid = document.querySelector('#project-grid');
      const message = document.querySelector('#dashboard-message');
      const projectCount = document.querySelector('#project-count');
      const highPriorityCount = document.querySelector('#high-priority-count');
      const atRiskCount = document.querySelector('#at-risk-count');
      const blockedCount = document.querySelector('#blocked-count');

      function readValue(project, key, fallback) {
        const value = project && typeof project[key] === 'string' ? project[key].trim() : '';
        return value || fallback;
      }

      function setMessage(text) {
        message.textContent = text;
      }

      function createTextElement(tagName, className, text) {
        const element = document.createElement(tagName);
        if (className) {
          element.className = className;
        }
        element.textContent = text;
        return element;
      }

      function createBadge(text, baseClass, mappedClass) {
        const badge = document.createElement('span');
        badge.className = mappedClass ? `${baseClass} ${mappedClass}` : baseClass;
        badge.textContent = text;
        return badge;
      }

      function createProjectCard(project) {
        const name = readValue(project, 'name', 'Untitled project');
        const owner = readValue(project, 'owner', 'Owner unavailable');
        const status = readValue(project, 'status', 'Status unavailable');
        const priority = readValue(project, 'priority', 'Priority unavailable');
        const summary = readValue(project, 'summary', 'Summary unavailable.');
        const recentActivity = readValue(project, 'recentActivity', 'Recent activity unavailable.');

        const card = document.createElement('article');
        card.className = 'project-card';

        const header = document.createElement('div');
        header.className = 'project-card__header';

        const titleGroup = document.createElement('div');
        titleGroup.append(
          createTextElement('h2', 'project-card__title', name),
          createTextElement('span', 'project-card__owner', owner)
        );

        header.append(
          titleGroup,
          createBadge(status, 'status-badge', statusClasses[status])
        );

        const meta = document.createElement('div');
        meta.className = 'project-card__meta';
        meta.append(createBadge(priority, 'status-badge', priorityClasses[priority]));

        card.append(
          header,
          createTextElement('p', 'project-card__summary', summary),
          createTextElement('p', 'project-card__activity', recentActivity),
          meta
        );

        return card;
      }

      function updateSummary(projects) {
        projectCount.textContent = String(projects.length);
        highPriorityCount.textContent = String(projects.filter((project) => readValue(project, 'priority', '') === 'High').length);
        atRiskCount.textContent = String(projects.filter((project) => readValue(project, 'status', '') === 'At risk').length);
        blockedCount.textContent = String(projects.filter((project) => readValue(project, 'status', '') === 'Blocked').length);
      }

      function renderProjects(projects) {
        projectGrid.replaceChildren();
        updateSummary(projects);

        if (projects.length === 0) {
          setMessage('No projects are available yet. Add project records to project-data.json to populate the dashboard.');
          return;
        }

        const cards = projects.map(createProjectCard);
        projectGrid.append(...cards);
        setMessage(`${projects.length} project${projects.length === 1 ? '' : 's'} loaded from project-data.json.`);
      }

      async function loadProjects() {
        try {
          const response = await fetch(dataUrl);
          if (!response.ok) {
            throw new Error(`Request failed with status ${response.status}`);
          }

          const data = await response.json();
          if (!data || !Array.isArray(data.projects)) {
            throw new Error('Expected a top-level projects array.');
          }

          renderProjects(data.projects);
        } catch (error) {
          projectGrid.replaceChildren();
          updateSummary([]);
          setMessage(`Project data could not be loaded from project-data.json. ${error.message}`);
        }
      }

      loadProjects();
    </script>
  </body>
</html>
